<!DOCTYPE html>

<html>

<head>
    <title>Edit Interview | Smart Job Career</title>

```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
    }

    .header a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-size: 14px;
    }

    .header a:hover {
        text-decoration: underline;
    }

    /* Main */
    .container {
        width: 90%;
        max-width: 850px;
        margin: 45px auto;
    }

    .page-heading {
        margin-bottom: 25px;
    }

    .page-heading h1 {
        margin: 0;
        font-size: 30px;
        color: #111827;
    }

    .page-heading p {
        margin-top: 8px;
        color: #6b7280;
        font-size: 15px;
    }

    /* Form Card */
    .form-card {
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: white;
        font-family: Arial, Helvetica, sans-serif;
        transition: 0.2s;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* Buttons */
    .form-actions {
        margin-top: 30px;
        display: flex;
        gap: 12px;
    }

    .btn {
        border: none;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .btn-secondary {
        background: #e5e7eb;
        color: #374151;
    }

    .btn-secondary:hover {
        background: #d1d5db;
    }

    /* Responsive */
    @media (max-width: 650px) {

        .header {
            padding: 18px 5%;
        }

        .header a {
            margin-left: 12px;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .form-card {
            padding: 25px 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: auto;
        }

        .form-actions {
            flex-direction: column;
        }

        .btn {
            width: 100%;
            text-align: center;
        }
    }
</style>
```

</head>

<body>

```
<!-- Header -->
<div class="header">

    <div class="logo">
        Smart Job Career
    </div>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/interviews">Interviews</a>
        <a href="/logout">Logout</a>
    </div>

</div>


<!-- Main Content -->
<div class="container">

    <div class="page-heading">
        <h1>Edit Interview</h1>
        <p>Update the details of your scheduled interview.</p>
    </div>


    <div class="form-card">

        <form method="POST">

            <div class="form-grid">

                <!-- Interview Date -->
                <div class="form-group">

                    <label>Interview Date</label>

                    <input
                        type="date"
                        name="interview_date"
                        value="{{ interview.interview_date }}"
                        required
                    >

                </div>


                <!-- Interview Time -->
                <div class="form-group">

                    <label>Interview Time</label>

                    <input
                        type="time"
                        name="interview_time"
                        value="{{ interview.interview_time }}"
                        required
                    >

                </div>


                <!-- Interview Type -->
                <div class="form-group">

                    <label>Interview Type</label>

                    <select name="interview_type">

                        <option value="Online"
                            {% if interview.interview_type == "Online" %}selected{% endif %}>
                            Online
                        </option>

                        <option value="Offline"
                            {% if interview.interview_type == "Offline" %}selected{% endif %}>
                            Offline
                        </option>

                        <option value="Phone"
                            {% if interview.interview_type == "Phone" %}selected{% endif %}>
                            Phone
                        </option>

                    </select>

                </div>


                <!-- Status -->
                <div class="form-group">

                    <label>Status</label>

                    <select name="status">

                        <option value="Scheduled"
                            {% if interview.status == "Scheduled" %}selected{% endif %}>
                            Scheduled
                        </option>

                        <option value="Completed"
                            {% if interview.status == "Completed" %}selected{% endif %}>
                            Completed
                        </option>

                        <option value="Cancelled"
                            {% if interview.status == "Cancelled" %}selected{% endif %}>
                            Cancelled
                        </option>

                    </select>

                </div>


                <!-- Notes -->
                <div class="form-group full-width">

                    <label>Interview Notes</label>

                    <textarea
                        name="notes"
                        placeholder="Enter interview notes, preparation points, or other details..."
                    >{{ interview.notes }}</textarea>

                </div>

            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Update Interview
                </button>

                <a
                    href="/interviews"
                    class="btn btn-secondary"
                >
                    Back to Interviews
                </a>

            </div>

        </form>

    </div>

</div>
```

</body>

</html>
