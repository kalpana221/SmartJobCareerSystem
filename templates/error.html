<!DOCTYPE html>
<html>
<head>
    <title>Error</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-box {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 60px;
            margin: 0;
            color: #2c3e50;
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #1a252f;
        }
    </style>
</head>

<body>

    <div class="error-box">

        <h1>{{ error_code }}</h1>

        <h2>{{ error_message }}</h2>

        <p>Something went wrong. Please try again.</p>

        <a href="/dashboard">Back to Dashboard</a>

    </div>

</body>
</html>
