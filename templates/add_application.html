<!DOCTYPE html>

<html>
<head>
    <title>Add Job Application | Smart Job Career</title>

```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
    }

    .header a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-size: 14px;
    }

    .header a:hover {
        text-decoration: underline;
    }

    /* Main container */
    .container {
        width: 90%;
        max-width: 850px;
        margin: 45px auto;
    }

    .page-heading {
        margin-bottom: 25px;
    }

    .page-heading h1 {
        margin: 0;
        font-size: 30px;
        color: #111827;
    }

    .page-heading p {
        margin-top: 8px;
        color: #6b7280;
        font-size: 15px;
    }

    /* Form card */
    .form-card {
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
    }

    input,
    select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: #fff;
        transition: 0.2s;
    }

    input:focus,
    select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* Buttons */
    .form-actions {
        margin-top: 30px;
        display: flex;
        gap: 12px;
    }

    .btn {
        border: none;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .btn-secondary {
        background: #e5e7eb;
        color: #374151;
    }

    .btn-secondary:hover {
        background: #d1d5db;
    }

    /* Responsive */
    @media (max-width: 650px) {

        .header {
            padding: 18px 5%;
        }

        .header a {
            margin-left: 12px;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .form-card {
            padding: 25px 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: auto;
        }

        .form-actions {
            flex-direction: column;
        }

        .btn {
            text-align: center;
            width: 100%;
        }
    }
</style>
```

</head>

<body>

```
<!-- Header -->
<div class="header">

    <div class="logo">
        Smart Job Career
    </div>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>


<!-- Main Content -->
<div class="container">

    <div class="page-heading">
        <h1>Add Job Application</h1>
        <p>Track a new job application in your career dashboard.</p>
    </div>


    <div class="form-card">

        <form method="POST" action="/add-application">

            <div class="form-grid">

                <div class="form-group">
                    <label>Company Name</label>
                    <input
                        type="text"
                        name="company_name"
                        placeholder="Enter company name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Job Role</label>
                    <input
                        type="text"
                        name="job_role"
                        placeholder="e.g. Python Developer"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Location</label>
                    <input
                        type="text"
                        name="location"
                        placeholder="e.g. Hyderabad"
                    >
                </div>


                <div class="form-group">
                    <label>Status</label>

                    <select name="status">

                        <option value="Applied">
                            Applied
                        </option>

                        <option value="Interview">
                            Interview
                        </option>

                        <option value="Selected">
                            Selected
                        </option>

                        <option value="Rejected">
                            Rejected
                        </option>

                    </select>

                </div>


                <div class="form-group full-width">

                    <label>Applied Date</label>

                    <input
                        type="date"
                        name="applied_date"
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Application
                </button>

                <a
                    href="/dashboard"
                    class="btn btn-secondary"
                >
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>
```

</body>
</html>
