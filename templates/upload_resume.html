<!DOCTYPE html>

<html>

<head>
    <title>Upload Resume | Smart Job Career</title>

```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    /* Header */
    .header {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
    }

    .header a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-size: 14px;
    }

    .header a:hover {
        text-decoration: underline;
    }

    /* Main */
    .container {
        width: 90%;
        max-width: 700px;
        margin: 55px auto;
    }

    .page-heading {
        text-align: center;
        margin-bottom: 25px;
    }

    .page-heading h1 {
        margin: 0;
        font-size: 30px;
        color: #111827;
    }

    .page-heading p {
        margin-top: 8px;
        color: #6b7280;
        font-size: 15px;
    }

    /* Upload Card */
    .upload-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .upload-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #eff6ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
    }

    .upload-card h2 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #111827;
    }

    .upload-card .description {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 28px;
    }

    /* File input */
    .file-area {
        border: 2px dashed #bfdbfe;
        background: #f8fbff;
        border-radius: 12px;
        padding: 28px 20px;
        margin-bottom: 25px;
    }

    .file-area label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 12px;
    }

    input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        font-size: 14px;
        cursor: pointer;
    }

    input[type="file"]:focus {
        outline: none;
        border-color: #2563eb;
    }

    .file-info {
        margin-top: 12px;
        font-size: 12px;
        color: #6b7280;
    }

    /* Buttons */
    .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .btn {
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: #2563eb;
        color: white;
    }

    .btn-primary:hover {
        background: #1d4ed8;
    }

    .btn-secondary {
        background: #e5e7eb;
        color: #374151;
    }

    .btn-secondary:hover {
        background: #d1d5db;
    }

    /* Responsive */
    @media (max-width: 650px) {

        .header {
            padding: 18px 5%;
        }

        .header a {
            margin-left: 12px;
        }

        .container {
            width: 92%;
            margin: 35px auto;
        }

        .upload-card {
            padding: 30px 20px;
        }

        .actions {
            flex-direction: column;
        }

        .btn {
            width: 100%;
            text-align: center;
        }
    }
</style>
```

</head>

<body>

```
<!-- Header -->
<div class="header">

    <div class="logo">
        Smart Job Career
    </div>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/resumes">My Resumes</a>
        <a href="/logout">Logout</a>
    </div>

</div>


<!-- Main Content -->
<div class="container">

    <div class="page-heading">
        <h1>Upload Resume</h1>
        <p>Upload your latest resume and keep it organized in your career dashboard.</p>
    </div>


    <div class="upload-card">

        <div class="upload-icon">
            📄
        </div>

        <h2>Upload Your Resume</h2>

        <p class="description">
            Select a resume file from your computer to upload it securely.
        </p>


        <form
            method="POST"
            action="/upload-resume"
            enctype="multipart/form-data"
        >

            <div class="file-area">

                <label for="resume">
                    Select Resume
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required
                >

                <div class="file-info">
                    Accepted formats: PDF, DOC, DOCX
                </div>

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Upload Resume
                </button>

                <a
                    href="/dashboard"
                    class="btn btn-secondary"
                >
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>
```

</body>

</html>
